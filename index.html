<style>
/* Layout concept: exchange-board page. A phase rail on top, one working panel below,
   ruled contract-note tables, and every committed entry carries a stamped LOCKED seal. */
:root{
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#E8EEEB; --surface:#F6F9F7; --surface-2:#DAE3DE; --ink:#10211B; --muted:#55675E; --line:#BFCBC5;
  --accent:#F0A92B; --on-accent:#1B1300; --accent-text:#8A5700;
  --gain:#0C7A4B; --loss:#BC3027; --on-sig:#FFFFFF; --gain-bg:#D2EDE0; --loss-bg:#F6D9D5;
  --stamp:#23408E; --gold:#B58200; --silver:#7D8A84; --bronze:#A5602F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1613; --surface:#15211D; --surface-2:#1E2E29; --ink:#E5EEE9; --muted:#93A59C; --line:#2C3E38;
    --accent:#F0AE3A; --on-accent:#1B1300; --accent-text:#F0AE3A;
    --gain:#4FC58C; --loss:#F27D72; --on-sig:#0B1410; --gain-bg:#12382A; --loss-bg:#3D1B18;
    --stamp:#97AEF5; --gold:#E2B33C; --silver:#AEBBB5; --bronze:#D58B5A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1613; --surface:#15211D; --surface-2:#1E2E29; --ink:#E5EEE9; --muted:#93A59C; --line:#2C3E38;
  --accent:#F0AE3A; --on-accent:#1B1300; --accent-text:#F0AE3A;
  --gain:#4FC58C; --loss:#F27D72; --on-sig:#0B1410; --gain-bg:#12382A; --loss-bg:#3D1B18;
  --stamp:#97AEF5; --gold:#E2B33C; --silver:#AEBBB5; --bronze:#D58B5A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1{font:800 clamp(36px,8vw,60px)/.88 var(--font-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font:800 clamp(24px,5vw,32px)/1 var(--font-display);text-transform:uppercase;letter-spacing:.015em;text-wrap:balance}
h3{font:600 15px/1.3 var(--font-body)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;padding-bottom:14px;border-bottom:3px solid var(--ink)}
.top .eyebrow{margin-top:8px}
.pill{font:500 12px var(--font-mono);border:1px solid var(--line);border-radius:99px;padding:4px 11px;background:var(--surface);white-space:nowrap}
.pill.err{border-color:var(--loss);color:var(--loss)}
.phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:14px 0 4px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.ph{padding:7px 8px 8px;border-right:1px solid var(--line);min-width:0}
.ph:last-child{border-right:0}
.ph span{display:block;font:500 10px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ph b{display:block;font:800 19px/1.1 var(--font-display);text-transform:uppercase;overflow-wrap:anywhere}
.ph.done b{color:var(--muted)}
.ph.on{background:var(--accent);color:var(--on-accent)}
.ph.on span,.ph.on b{color:var(--on-accent)}
.tabs{display:flex;flex-wrap:wrap;gap:4px 22px;margin:14px 0 18px;border-bottom:1px solid var(--line)}
.tabs a{padding:8px 0 9px;color:var(--muted);text-decoration:none;font:600 14px var(--font-body);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:clamp(14px,3vw,22px)}
.stack{display:flex;flex-direction:column;gap:18px}
.lead{color:var(--muted);max-width:68ch}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px}
.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:14px 0 4px}
.rail div{padding:6px 2px 0;border-top:4px solid var(--line);font:500 10.5px/1.3 var(--font-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.rail .done{border-color:var(--ink);color:var(--ink)}
.rail .on{border-color:var(--accent);color:var(--ink);font-weight:600}
.btn{font:600 14px var(--font-body);min-height:44px;padding:9px 18px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.armed{background:var(--loss);border-color:var(--loss);color:var(--on-sig)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;min-height:44px;width:100%;min-width:0}
input[disabled]{opacity:.5}
.lbl{display:block;font:500 11px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.grid{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

.money span{padding-left:12px;font-family:var(--font-mono);color:var(--muted)}
.money input{border:0;background:transparent;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px 16px;align-items:center;padding:12px 0;border-top:1px dashed var(--line)}
.prow .nm b{display:block;font:800 22px/1 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.prow .nm span{font-size:13px;color:var(--muted)}
.prow .ctx{grid-column:1/-1;font:12px var(--font-mono);color:var(--muted)}
.msg{min-height:22px;font-weight:600;color:var(--loss)}
.msg.ok{color:var(--gain)}
.seal{display:inline-block;font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--stamp);border:2px solid var(--stamp);border-radius:4px;padding:2px 7px;transform:rotate(-2deg);white-space:nowrap}
.strip{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:6px;padding:7px 11px;background:var(--bg);min-width:0}
.chip b{display:block;font:800 18px/1 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.chip span{font:13px var(--font-mono)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.tm{display:flex;flex-direction:column;gap:3px;text-align:left;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit;min-width:0;min-height:56px}
.tm b{font:800 19px/1 var(--font-display);text-transform:uppercase;overflow-wrap:anywhere}
.tm span{font:500 11px var(--font-mono);color:var(--muted)}
.tm.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tm.done span{color:var(--gain)}
.ticket{border:1.5px solid var(--ink);border-radius:8px;padding:clamp(12px,3vw,20px);background:var(--surface)}
.thead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;margin-bottom:6px}
.cashline{font:13px var(--font-mono);color:var(--muted)}
.cashline b{color:var(--ink);font-weight:600}
.leg{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.25fr) 112px minmax(0,1.5fr);gap:10px 14px;align-items:start;padding:14px 0;border-top:1px dashed var(--line)}
.leg .who b{display:block;font:800 22px/1 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.leg .who span{display:block;font-size:13px;color:var(--muted)}
.leg .who .px{font:500 13px var(--font-mono);color:var(--ink);margin-top:3px}
.leg .calc{grid-column:1/-1;font:12.5px/1.5 var(--font-mono);color:var(--muted)}
.leg .calc .bad{color:var(--loss);font-weight:600}
.leg.done{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.leg.done .calc{grid-column:auto;font-size:13px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:6px;overflow:hidden;min-height:44px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;font:600 13px var(--font-mono);text-transform:uppercase;letter-spacing:.04em;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label.buy:has(input:checked){background:var(--gain);color:var(--on-sig)}
.seg label.sell:has(input:checked){background:var(--loss);color:var(--on-sig)}
.seg label:has(input:focus-visible){outline:3px solid var(--accent-text);outline-offset:-3px}
.tag{font:600 11px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.tag.good{background:var(--gain-bg);color:var(--gain);border-color:transparent}
.tag.bad{background:var(--loss-bg);color:var(--loss);border-color:transparent}
.tag.hold{color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:500 10.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:2px solid var(--ink);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.n{text-align:right}
.tbl .rk{font:800 24px/1 var(--font-display);width:44px}
.tbl .tn{font-weight:600}
.tbl .tn small{display:block;font:400 11.5px var(--font-mono);color:var(--muted);font-weight:400}
.tbl tr.cut td{background:var(--loss-bg)}
.up{color:var(--gain)} .dn{color:var(--loss)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:6px 0 0}
.pod{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;border:1.5px solid var(--ink);border-bottom-width:6px;border-radius:8px 8px 0 0;padding:12px 8px;text-align:center;background:var(--surface);min-width:0}
.pod .num{font:900 clamp(60px,15vw,128px)/.82 var(--font-display)}
.pod .nm{font:800 clamp(18px,4.4vw,32px)/1 var(--font-display);text-transform:uppercase;overflow-wrap:anywhere}
.pod .pv{font:600 clamp(11px,2.6vw,15px) var(--font-mono)}
.p1{min-height:290px;border-color:var(--gold)} .p1 .num{color:var(--gold)}
.p2{min-height:220px} .p2 .num{color:var(--silver)}
.p3{min-height:172px} .p3 .num{color:var(--bronze)}
.note{border-left:4px solid var(--accent);padding:8px 12px;background:var(--surface);color:var(--muted);font-size:14px}
.cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.rules dt{font:600 12px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;margin-top:12px}
.rules dd{margin:2px 0 0;color:var(--muted)}
.rules ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}
.formula{font:13px/1.9 var(--font-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 14px;overflow-x:auto}
textarea{font:12px/1.4 var(--font-mono);min-height:140px}
@media (max-width:820px){
  .leg{grid-template-columns:minmax(0,1fr)}
  .leg.done{grid-template-columns:minmax(0,1fr)}
  .prow{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.pod{animation:rise .5s ease-out both}.p1{animation-delay:.15s}.p2{animation-delay:.3s}.p3{animation-delay:.45s}}
@keyframes rise{from{transform:translateY(18px);opacity:.2}to{transform:none;opacity:1}}
</style>

<style>
.steps{display:grid;margin:6px 0 4px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.stp{padding:6px 2px 7px;border-right:1px solid var(--line);text-align:center;min-width:0}
.stp:last-child{border-right:0}
.stp span{display:block;font:500 9px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

.leg.one{grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) 112px minmax(0,1.5fr)}

      else { if(q>sh) status='Not enough shares'; else{cash=r2(cash+a-f);sh-=q;amt=a;fee=f} }
    }
  }
  return {d:d,q:status==='ok'?q:0,amt:amt,fee:fee,flow:d==='Buy'?-amt:d==='Sell'?amt:0,status:status,cashOpen:cOpen,cashClose:cash,shOpen:sOpen,shClose:sh,open:open};
}
function allParticipants(){return S.cfg.participants.map(function(_,i){return i})}
function hist(t){
  var rows=[], cash=S.cfg.capital, sh=0, cap=S.cfg.capital, trades=0, fees=0, lr=null;
  for(var i=0;i<S.steps.length;i++){
    var st=S.steps[i], o=st.orders[t];
    if(!o){ if(st.closed) o={row:{d:'Hold',q:0,why:''},auto:true,at:st.closedAt}; else break; }
    var x=apply(st.open,cash,sh,o.row,S.cfg.cost);
    x.step=i+1; x.why=o.auto?'Auto-hold: trading closed before this person locked':(o.row.why||''); x.at=o.at; x.auto=!!o.auto; x.scenario=st.scenario;
    cash=x.cashClose; sh=x.shClose;
    if(x.d!=='Hold'&&x.status==='ok'){trades++;fees=r2(fees+x.fee)}
    x.close=st.close; x.pv=null; x.sv=null;
    if(st.close!=null){x.sv=r2(sh*st.close);x.pv=r2(cash+x.sv);lr=x}
    rows.push(x);
  }
  return {rows:rows,cash:cash,sh:sh,trades:trades,fees:fees,last:lr,
    scash:lr?lr.cashClose:cap,sshare:lr?lr.shClose:0,
    pv:lr?lr.pv:cap,pl:lr?r2(lr.pv-cap):0,ret:lr?(lr.pv-cap)/cap*100:0};
}

function standings(){

  rows.sort(function(a,b){return b.pv-a.pv||b.scash-a.scash||a.t-b.t});
  rows.forEach(function(x,i){x.rank=i+1});
  return rows;
}
function stage(){
  var n=S.steps.length, last=S.steps[n-1];
  if(!last||(last.closed&&n<NSTEP)) return {k:'open',i:n};
  if(!last.closed) return {k:'trade',i:n-1};
  return {k:'final',i:n-1};
}

/* ---------- persistence ---------- */
function setSync(k){sync=k;var e=document.getElementById('sync');if(e){e.textContent=syncLabel();e.className='pill'+(k==='error'?' err':'')}}
function syncLabel(){return sync==='live'?'Live · saved':sync==='ro'?'Read-only · live':sync==='local'?'Saved in this browser only':sync==='error'?'Save failed':'Connecting…'}
function commit(fn){
  if(!canWrite&&!canTrade()) return;
  S=fn(S?JSON.parse(JSON.stringify(S)):null); REV+=1; persist(); render();
}
function persist(){
  if(mode==='local'){lsSet(LS_STATE,{rev:REV,state:S});setSync('local');return}
  dirty=true; if(!writing) flush();
}
async function flush(){
  writing=true; var tries=0;
  while(dirty){
    dirty=false;
    try{ await dbRef.set(JSON.parse(JSON.stringify({rev:REV,state:S}))); setSync('live'); tries=0 }
    catch(e){
      setSync('error'); var c=e&&e.code;
      if((c==='unavailable'||c==='resource_exhausted')&&tries<4){tries++;dirty=true;await new Promise(function(r){setTimeout(r,2000*tries)})}
    }
  }
  writing=false;
}

function importParticipantsCSV(inputEl){
  var file=inputEl.files&&inputEl.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    var lines=String(reader.result||'').split(/\r\n|\r|\n/).map(function(l){return l.trim()}).filter(function(l){return l});
    var added=0, dupes=0;
    lines.forEach(function(l){
      // Accept a plain name per line, or the first column of a simple CSV row.
      var nm=l.split(',')[0].replace(/^"|"$/g,'').trim();
      if(!nm) return;
      var r=addParticipantName(nm);
      if(r.ok) added++; else if(r.error) dupes++;
    });
    saveDrafts();
    render();
    say(added?('Added '+added+' participant'+(added===1?'':'s')+(dupes?' ('+dupes+' duplicate name'+(dupes===1?'':'s')+' skipped)':'')+'.'):('No new names found in that file.'+(dupes?' All '+dupes+' were already on the list.':'')),added>0);
  };
  reader.onerror=function(){say('Could not read that file. Try again.')};
  reader.readAsText(file);
}
function readSetup(){
  var v=function(id){var e=document.getElementById(id);return e?e.value.trim():''};
  var capital=Number(v('cap').replace(/,/g,'')), costPct=Number(v('cost'));
  if(!(capital>=1000)) return {error:'Starting capital must be at least ₹1,000.'};
  if(!(costPct>=0&&costPct<=5)) return {error:'Transaction cost must be between 0% and 5%.'};
  var participants=drafts.setup.participants.slice();
  if(participants.length<1) return {error:'Add at least one participant.'};
  if(new Set(participants.map(function(x){return x.toLowerCase()})).size<participants.length) return {error:'Participant names must all be different.'};
  var sy=v('ss0').toUpperCase().replace(/\s+/g,''), nm=v('sn0'), bp=Number(v('bp0').replace(/,/g,''));
  if(!sy||!nm) return {error:'Fill in the stock symbol and company.'};
  if(!(bp>0)) return {error:'Enter a starting price above ₹0.'};
  var script=[];
  for(var i=0;i<NSTEP;i++){
    var k='0_'+i, h=v('h'+k), d=v('d'+k), g=Number(v('g'+k));
    if(!h||!d) return {error:'Day '+(i+1)+' needs a headline and a description.'};

    script.push({h:h,d:d,pct:g});
  }
  return {cfg:{capital:r2(capital),cost:costPct/100,participants:participants,stock:{sym:sy,name:nm},base:r2(bp),startedAt:Date.now()},script:script};
}

  var body=rows.map(function(x){
    var c='<td class="tn">'+esc(S.cfg.participants[x.t])+'</td>';
    for(var i=0;i<N;i++){var r=x.rows[i];c+='<td class="n">'+(r&&r.pv!=null?num(Math.round(r.pv)):'—')+'</td>'}
    return '<tr>'+c+'</tr>';
  }).join('');
  return '<div><h3 style="margin-bottom:6px">Portfolio value after each day (₹)</h3><div class="scroll"><table class="tbl"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
}
function reviewHTML(rows){
  var body=rows.map(function(x){
    var prev=S.cfg.capital,best=null,worst=null;
    x.rows.forEach(function(r){if(r.pv==null)return;var d=r2(r.pv-prev);prev=r.pv;if(!best||d>best.d)best={d:d,s:r.step};if(!worst||d<worst.d)worst={d:d,s:r.step}});
    var holds=x.rows.filter(function(r){return r.d==='Hold'}).length;
    return '<tr><td class="tn">'+esc(S.cfg.participants[x.t])+'</td><td class="n">'+x.trades+'</td><td class="n">'+holds+'</td><td class="n">'+inr(x.fees)+'</td><td class="n '+cls(best?best.d:0)+'">'+(best?sgn(best.d)+' (day '+best.s+')':'—')+'</td><td class="n '+cls(worst?worst.d:0)+'">'+(worst?sgn(worst.d)+' (day '+worst.s+')':'—')+'</td></tr>';
  }).join('');
  return '<div><h3 style="margin-bottom:6px">Performance review</h3><div class="scroll"><table class="tbl"><thead><tr><th>Participant</th><th class="n">Trades</th><th class="n">Holds</th><th class="n">Costs paid</th><th class="n">Best day</th><th class="n">Worst day</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
}
function logHTML(){
  var rows=S.steps.filter(function(s){return s.closed}).map(function(st,i){
    var mv=(st.close/st.open-1)*100;
    return '<tr><td>'+(i+1)+'</td><td style="min-width:240px"><b>'+esc(st.scenario.h)+'</b><br><span style="color:var(--muted);font-size:13px">'+esc(st.scenario.d)+'</span></td><td class="n">'+inr(st.open)+'</td><td class="n">'+inr(st.close)+'</td><td class="n '+cls(mv)+'"><b>'+pct(mv)+'</b></td></tr>';
  }).join('');
  if(!rows) return '';
  return '<div><h3 style="margin-bottom:6px">Scenario log · '+esc(S.cfg.stock.sym)+'</h3><div class="scroll"><table class="tbl"><thead><tr><th>Day</th><th>Scenario</th><th class="n">Opening</th><th class="n">Closing</th><th class="n">Move</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function finalHTML(){
  var rows=standings();
  return '<div class="stack"><div class="panel stack"><div><h2>Final results</h2><p class="lead">Trading is closed. Ranked by final portfolio value. Ties go to higher cash, then whoever was added first.</p></div>'
    +standTable(rows)+'</div>'+byStep(rows)+logHTML()+reviewHTML(rows)+'<div class="actions"><button class="btn pri" data-act="csv">Download all decisions (CSV)</button></div><p class="msg" id="msg" role="status"></p></div>';
}
function lastStepNote(){
  var d=doneSteps(); if(!d) return '';
  var rows=standings(), top=rows.slice(0,3).map(function(x){return ord(x.rank)+' '+esc(S.cfg.participants[x.t])+' '+inr(x.pv)}).join(' · ');
  return '<p class="note"><b>After day '+d+':</b> '+top+'. <a href="#board">Full leaderboard</a></p>';
}
function playHTML(){
  if(!loaded) return '<section class="panel"><p class="lead">Opening the exchange…</p></section>';
  if(!S) return setupHTML();
  if(!canWrite&&!canTrade()) return personPickHTML();
  var sg=stage(), h;
  if(sg.k==='final') return finalHTML();
  var tags={open:'Ready to start the day',trade:'Trading is open'};
  if(sg.k==='open') h=lastStepNote()+openHTML(sg.i);
  else h=tradingHTML(sg.i);
  return '<div class="stack"><div class="head"><h2>Day '+(sg.i+1)+' of '+NSTEP+'</h2><span class="eyebrow">'+tags[sg.k]+'</span></div>'+h+'</div>';
}
function boardHTML(){
  if(!loaded||!S) return '<section class="panel"><p class="lead">Standings appear once the game starts and the first closing price is locked.</p></section>';
  var rows=standings();
  if(!rows) return '<section class="panel"><p class="lead">Standings appear as soon as the first closing price is locked.</p></section>';
  var done=doneSteps(), complete=stage().k==='final';
  return '<div class="stack"><div class="stack"><div class="head"><h2>'+(complete?'Final standings':'Standings after day '+done)+'</h2></div>'+standTable(rows)+byStep(rows)+logHTML()+'</div></div>';
}

function ledgerRows(){
  var out=[];
  allParticipants().forEach(function(t){hist(t).rows.forEach(function(x){out.push({t:t,person:S.cfg.participants[t],x:x})})});
  return out.sort(function(a,b){return a.x.step-b.x.step||a.t-b.t});
}
function toCSV(){
  var head=['Day','Participant','Stock','Opening Price (INR)','Closing Price (INR)','Decision','Quantity','Amount (INR)','Transaction Cost (INR)','Money Opening Balance (INR)','Money Closing Balance (INR)','Stocks Opening Balance (Shares)','Stocks Closing Balance (Shares)','Portfolio Value (INR)','Scenario','Reason','Locked At'];
  var q=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var lines=[head.join(',')];
  ledgerRows().forEach(function(r){var x=r.x;lines.push([x.step,r.person,S.cfg.stock.sym,x.open,x.close==null?'':x.close,x.d,x.q,x.flow,x.fee,x.cashOpen,x.cashClose,x.shOpen,x.shClose,x.pv==null?'':x.pv,(x.scenario?x.scenario.h+'. '+x.scenario.d:''),x.why,new Date(x.at).toISOString()].map(q).join(','))});
  return lines.join('\n');
}
function ledgerHTML(){
  if(!loaded||!S) return '<section class="panel"><p class="lead">The ledger fills in as participants lock their orders.</p></section>';
  var rows=ledgerRows().filter(function(r){return (ui.fs==='all'||String(r.x.step)===ui.fs)&&(ui.ft==='all'||String(r.t)===ui.ft)});
  var sopt='<option value="all">All days</option>'+Array.from({length:NSTEP},function(_,i){return i+1}).map(function(i){return '<option value="'+i+'"'+(ui.fs===String(i)?' selected':'')+'>Day '+i+'</option>'}).join('');
  var topt='<option value="all">All participants</option>'+S.cfg.participants.map(function(n,i){return '<option value="'+i+'"'+(ui.ft===String(i)?' selected':'')+'>'+esc(n)+'</option>'}).join('');
  var body=rows.map(function(r){var x=r.x;
    return '<tr><td>'+x.step+'</td><td class="tn">'+esc(r.person)+'</td><td>'+esc(S.cfg.stock.sym)+'</td><td class="n">'+inr(x.open)+'</td><td class="n">'+(x.close==null?'—':inr(x.close))+'</td><td><span class="tag '+(x.d==='Buy'?'good':x.d==='Sell'?'bad':'hold')+'">'+x.d+'</span></td><td class="n">'+num(x.q)+'</td><td class="n">'+(x.flow?sgn(x.flow):'0')+'</td><td class="n">'+inr(x.cashOpen)+'</td><td class="n">'+inr(x.cashClose)+'</td><td class="n">'+num(x.shOpen)+'</td><td class="n">'+num(x.shClose)+'</td><td class="n">'+(x.pv==null?'—':inr(x.pv))+'</td><td style="min-width:200px">'+esc(x.why)+'</td></tr>';
  }).join('');
  var table=rows.length?'<div class="scroll"><table class="tbl"><thead><tr><th>Day</th><th>Participant</th><th>Stock</th><th class="n">Opening price</th><th class="n">Closing price</th><th>Decision</th><th class="n">Quantity</th><th class="n">Amount</th><th class="n">Money open</th><th class="n">Money close</th><th class="n">Shares open</th><th class="n">Shares close</th><th class="n">Portfolio value</th><th>Reason</th></tr></thead><tbody>'+body+'</tbody></table></div>':'<p class="note">No locked orders match this filter yet.</p>';
  var acts=dl?'<button class="btn pri" data-act="csv">Download CSV</button>':'<button class="btn pri" data-act="copycsv">Copy CSV</button>';
  return '<div class="stack"><div class="head"><h2>Decision ledger</h2><span class="eyebrow">'+rows.length+' locked rows</span></div>'
    +'<p class="lead">Every Buy, Sell and Hold in the same columns as the assignment sheet. Amount is negative for a Buy and positive for a Sell.</p>'
    +'<div class="actions"><div style="min-width:130px"><label class="lbl" for="fs">Day</label><select id="fs" data-flt="fs">'+sopt+'</select></div><div style="min-width:150px"><label class="lbl" for="ft">Participant</label><select id="ft" data-flt="ft">'+topt+'</select></div><div style="align-self:flex-end">'+acts+'</div></div>'
    +'<p class="msg" id="msg" role="status"></p>'+table+(ui.csv?'<textarea id="csvbox" readonly aria-label="CSV text">'+esc(ui.csv)+'</textarea>':'')+'</div>';
}
function rulesHTML(){
  var c=S?S.cfg:{capital:100000,cost:0};
  var costTxt=(c.cost*100).toFixed(2).replace(/\.?0+$/,'')||'0';
  var h='<div class="stack"><h2>How the game runs</h2><div class="cols"><div class="panel"><h3>One round</h3><dl class="rules">'
    +'<dt>One stock, '+NSTEP+' days</dt><dd>'+(S?esc(S.cfg.stock.sym):'Cipla')+', traded over '+NSTEP+' days with a fresh start for every participant. At the end, everyone is ranked by final portfolio value. Ties go to higher cash, then whoever was added first.</dd>'
    +'<dt>Every day</dt><dd>1. The instructor starts the day. The scenario and the opening price appear for everyone. The opening price is the previous closing price. The scenario says what happened, and each participant decides whether the price will go up or down.<br>2. Each participant picks Buy, Sell or Hold and a quantity, then locks. Trades happen at the opening price.<br>3. The instructor closes trading. The closing price is worked out automatically from the scenario and shown to everyone, and portfolios are valued at it.<br>4. Cash and shares carry into the next day.</dd></dl></div>'
    +'<div class="panel"><h3>What cannot be edited</h3><ul><li>The participant list, the stock, starting price, capital and cost rate, after the game starts.</li><li>Scenarios and price moves, after the game starts. Opening and closing prices cannot be typed or changed.</li><li>A participant’s order, after they lock it.</li></ul><p class="lead" style="margin-top:10px">Every lock button asks for a second tap, so a stray touch cannot commit anything.</p></div></div>'
    +'<div class="panel stack"><h3>Calculations</h3><div class="formula">Amount = Quantity × Opening price<br>Cost = Amount × '+costTxt+'%, on every Buy and every Sell<br>Closing cash = Opening cash − Purchase + Sale − Cost<br>Closing shares = Opening shares + Bought − Sold<br>Portfolio value = Closing cash + Closing shares × Closing price<br>Profit / loss = Portfolio value − '+inr(c.capital)+'<br>Return = Profit / loss ÷ '+inr(c.capital)+' × 100</div>'
    +'<ul><li>A Buy cannot cost more than the cash on hand, cost included.</li><li>A Sell cannot be larger than the shares held.</li></ul></div>'
    +'<div class="panel stack"><div><h3>Practice on a real simulator first</h3><p class="lead">These platforms use virtual money only. Try one before game day, then compare it with this game in your report. Check their account and class limits first.</p></div>'
    +'<dl class="rules"><dt><a href="https://www.neostox.com/neostox-in-education" target="_blank" rel="noopener">Neostox for Education</a></dt><dd>Virtual trading on delayed live markets with equities, futures and options. Institutes run campus contests with rankings. Contest rules and pricing are by enquiry.</dd>'
    +'<dt><a href="https://viacapital.space/simulator" target="_blank" rel="noopener">VIA Capital Trade Simulator</a></dt><dd>Market, limit and stop-loss orders on NSE and BSE stocks, with charges shown, a trade journal for reasons, portfolio analytics and an opt-in leaderboard.</dd>'
    +'<dt><a href="https://tryvest.in" target="_blank" rel="noopener">Tryvest</a></dt><dd>Practice with virtual coins on demo prices replayed from 60 days ago. Includes lessons and a guided tour. Leaderboards and class features are not described.</dd></dl></div>';
  if(S&&canWrite){
    h+='<div class="panel stack"><h3>Start a new game</h3><p class="lead">This is the only way to clear a game. Type RESET to unlock the button.</p><div class="actions"><div style="min-width:160px"><label class="lbl" for="rst">Type RESET</label><input id="rst" autocomplete="off"></div><button class="btn" id="rstbtn" data-act="reset" data-confirm="Tap again to wipe this game" disabled style="align-self:flex-end">Wipe and start over</button></div></div>';
  }
  return h+'</div>';
}
function render(){
  var t=tab(), v=t==='play'?playHTML():t==='board'?boardHTML():t==='ledger'?ledgerHTML():rulesHTML();
  app.innerHTML=headHTML()+'<main>'+v+'</main>';
}

/* ---------- actions ---------- */
function say(text,ok){var e=document.getElementById('msg');if(e){e.textContent=text;e.className='msg'+(ok?' ok':'')}}
function precheck(act,b){
  if(act==='lock-orders'){
    var t0=+b.dataset.t;
    if(!canWrite&&!(canTrade()&&t0===myPerson)) return 'This view is read-only.';
    var sg=stage(),h=hist(t0),x=apply(S.steps[sg.i].open,h.cash,h.sh,getDraft(sg.i,t0),S.cfg.cost);return x.status==='ok'?null:'Fix the order before locking: '+x.status+'.'
  }
  if(!canWrite) return 'This view is read-only.';
  if(act==='start'){var r=readSetup();return r.error||null}
  if(act==='start-step'||act==='close-trading'){
    var g=stage(); if(!SCRIPT||!SCRIPT[g.i]) return 'The scenario script is not loaded in this browser.';
    return null;
  }
  return null;
}
function run(act,b){
  if(act==='host-open'){ui.hostOpen=true;render();return}
  if(act==='host-cancel'){ui.hostOpen=false;render();return}
  if(act==='host-login'){
    var inp=document.getElementById('hp'), v=inp?inp.value:'';
    if(v!==HOST_PASS){say('Wrong passphrase.');return}
    setHost(); canWrite=true; ui.hostOpen=false; clearMyPerson();
    setSync(mode==='db'?'live':'local'); render();
    if(mode==='db'&&DB){loadScript().then(render);}
    return;
  }
  if(act==='add-participant'){
    var inp2=document.getElementById('pname'), nm=inp2?inp2.value.trim():'';
    if(!nm){say('Enter a name first.');return}
    var r=addParticipantName(nm); if(r.error){say(r.error);return}
    if(inp2) inp2.value='';
    saveDrafts(); say(''); render(); return;
  }
  if(act==='remove-participant'){
    var ri=+b.dataset.t; drafts.setup.participants.splice(ri,1); saveDrafts(); render(); return;
  }
  if(act==='pick-team'){if(!canWrite&&!canTrade()){setMyPerson(+b.dataset.t);render()}return}
  if(act==='sel'){if(canWrite){ui.sel=+b.dataset.t;render()}return}
  if(act==='csv'){doCsv();return}
  if(act==='copycsv'){copyCsv();return}
  if(act==='start'){startGame(readSetup());return}
  if(act==='reset'){
    drafts={setup:{participants:[]},orders:{}}; saveDrafts(); ui.sel=null; SCRIPT=null;
    try{localStorage.removeItem(LS_SCRIPT)}catch(e){}
    if(DB){try{DB.doc(SDOC).delete()}catch(e){}}
    commit(function(){return null});location.hash='#play';return;
  }
  var sg=stage(), i=sg.i;
  if(act==='start-step'){
    var sc=SCRIPT&&SCRIPT[i]; if(!sc){say('The scenario script is not loaded in this browser.');return}
    ui.sel=null;
    commit(function(s){var open=i===0?s.cfg.base:s.steps[i-1].close;s.steps.push({open:open,scenario:{h:sc.h,d:sc.d},openAt:Date.now(),orders:{},closed:false,closedAt:0,close:null,closeAt:0});return s});return;
  }
  if(act==='lock-orders'){
    var t=+b.dataset.t; if(!canWrite&&t!==myPerson) return;
    var d=getDraft(i,t), row={d:d.d,q:d.d==='Hold'?0:Math.floor(Number(d.q)),why:String(d.why||'').trim().slice(0,140)};
    delete drafts.orders[i+':'+t]; saveDrafts();
    commit(function(s){s.steps[i].orders[t]={row:row,at:Date.now()};return s});
    var tm=allParticipants(); for(var k=0;k<tm.length;k++){if(!S.steps[i].orders[tm[k]]){ui.sel=tm[k];break}}
    render();return;
  }
  if(act==='close-trading'){
    var tms=allParticipants(), sc2=SCRIPT&&SCRIPT[i]; if(!sc2){say('The scenario script is not loaded in this browser.');return}
    commit(function(s){var st=s.steps[i];tms.forEach(function(t){if(!st.orders[t]){st.orders[t]={row:{d:'Hold',q:0,why:''},at:Date.now(),auto:true}}});st.closed=true;st.closedAt=Date.now();st.close=r2(st.open*(1+sc2.pct/100));st.closeAt=Date.now();return s});return;
  }
}
async function startGame(r){
  if(r.error){say(r.error);return}
  SCRIPT=r.script;
  if(mode==='db'){
    try{await DB.doc(SDOC).set({script:r.script})}catch(e){SCRIPT=null;console.error('Firestore write to secret/script failed:',e);say('Could not save the scenario script ('+(e&&e.code||e&&e.message||'see browser console')+'). Try again.');return}
  }else lsSet(LS_SCRIPT,{script:r.script});
  commit(function(){return {v:6,cfg:r.cfg,steps:[]}});
}
async function doCsv(){
  var text='﻿'+toCSV();
  if(!dl){copyCsv();return}
  try{await dl.save({filename:'dalal-street-derby-decisions.csv',data:text});say('CSV saved.',true)}
  catch(e){if(e&&e.code==='declined')return;ui.csv=text;say('Could not save a file here. The CSV is below, copy it from the box.');if(tab()==='ledger')render()}
}
async function copyCsv(){
  var text=toCSV();
  try{await navigator.clipboard.writeText(text);say('CSV copied to the clipboard.',true)}
  catch(e){ui.csv=text;if(tab()==='ledger'){render();var b=document.getElementById('csvbox');if(b){b.focus();b.select()}}say('Copy the CSV from the box below.')}
}

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  var act=b.dataset.act;
  if(b.dataset.confirm && !b.dataset.armed){
    var err=precheck(act,b); if(err){say(err);return}
    b.dataset.armed='1'; b.dataset.label=b.textContent; b.textContent=b.dataset.confirm; b.classList.add('armed');
    clearTimeout(b._t); b._t=setTimeout(function(){if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.label;b.classList.remove('armed')}},4500);
    return;
  }
  run(act,b);
});
function ticketOwner(){return canWrite?ui.sel:myPerson}
function refreshTicket(){
  var sg=stage(), t=ticketOwner(); if(sg.k!=='trade'||t==null) return;
  var st=S.steps[sg.i]; if(st.orders[t]) return;
  var h=hist(t), row=getDraft(sg.i,t), x=apply(st.open,h.cash,h.sh,row,S.cfg.cost);
  var c=document.getElementById('calc'); if(c) c.innerHTML=calcHTML(x);
  var q=document.getElementById('q'); if(q) q.disabled=row.d==='Hold';
  var ca=document.getElementById('cashafter'); if(ca) ca.textContent=inr(x.cashClose);
  var lb=document.getElementById('lockbtn'); if(lb){lb.disabled=x.status!=='ok'; if(lb.dataset.armed){delete lb.dataset.armed;lb.textContent=lb.dataset.label;lb.classList.remove('armed')}}
}
app.addEventListener('input',function(e){
  var el=e.target;
  if(el.hasAttribute('data-sf')){drafts.setup[el.id]=el.value;saveDrafts();return}
  if(el.hasAttribute('data-qty')||el.hasAttribute('data-why')){
    var sg2=stage(), d=getDraft(sg2.i,ticketOwner());
    if(el.hasAttribute('data-qty')) d.q=el.value.replace(/[^0-9.]/g,''); else d.why=el.value;
    saveDrafts(); refreshTicket(); return;
  }
  if(el.id==='rst'){var rb=document.getElementById('rstbtn');if(rb)rb.disabled=el.value!=='RESET'}
  if(el.id==='pname'){return}
});
app.addEventListener('keydown',function(e){
  if(e.target&&e.target.id==='pname'&&e.key==='Enter'){e.preventDefault();run('add-participant',e.target)}
});
app.addEventListener('change',function(e){
  var el=e.target;
  if(el.hasAttribute('data-dec')){
    var sg=stage(), d=getDraft(sg.i,ticketOwner()); d.d=el.value; if(el.value==='Hold') d.q=''; saveDrafts(); refreshTicket();
    if(el.value!=='Hold'){var q=document.getElementById('q');if(q)q.focus()}
    return;
  }
  if(el.dataset.flt){ui[el.dataset.flt]=el.value;render()}
  if(el.hasAttribute('data-sf')){drafts.setup[el.id]=el.value;saveDrafts()}
  if(el.id==='pcsv'){importParticipantsCSV(el);return}
});
window.addEventListener('hashchange',render);

/* ---------- boot ---------- */
async function loadScript(){
  if(mode!=='db'||!DB) return;
  try{var sn=await DB.doc(SDOC).get();if(sn.exists)SCRIPT=sn.data().script}catch(e){console.error('Firestore read of secret/script failed:',e)}
}
async function init(){
  render();
  var fbOk=false;
  try{
    if(!window.firebase||typeof firebase.initializeApp!=='function') throw new Error('Firebase SDK did not load (window.firebase missing)');
    if(typeof firebase.firestore!=='function') throw new Error('Firestore SDK did not load (firebase.firestore missing)');
    if(!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey==='REPLACE_ME') throw new Error('FIREBASE_CONFIG is not filled in');
    firebase.initializeApp(FIREBASE_CONFIG);
    DB=firebase.firestore(); fbOk=true;
  }catch(e){fbOk=false;console.error('Firebase init failed, falling back to local-only mode:',e)}
  if(fbOk){
    mode='db'; dbRef=DB.doc(DOC);
    canWrite=isHost;
    setSync(canWrite?'live':'ro');
    if(canWrite) await loadScript();
    var timer=setTimeout(function(){if(!loaded){loaded=true;render()}},3500);
    dbRef.onSnapshot(function(snap){
      var d=snap.exists?snap.data():null;
      if(d&&typeof d.rev==='number'&&d.rev>REV){REV=d.rev;S=d.state||null}
      clearTimeout(timer); loaded=true; render();
    },function(){setSync('error');loaded=true;render()});
  }else{
    mode='local'; canWrite=true;
    var saved=lsGet(LS_STATE); if(saved&&saved.state){S=saved.state;REV=saved.rev||1}
    var sv=lsGet(LS_SCRIPT); if(sv&&sv.script) SCRIPT=sv.script;
    loaded=true; setSync('local'); render();
  }
}
init();
})();
</script>
